<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تطبيق العميل - SmartRide</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; --dark: #0f172a; --light: #f8fafc; --border: #e2e8f0; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
    body { background: var(--light); color: var(--dark); height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    .topbar { background: var(--dark); color: #fff; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .wallet-badge { background: #1e293b; border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 20px; font-weight: 800; font-size: 0.78rem; }
    
    .rating-frame { padding: 3px 10px; border-radius: 10px; font-weight: 900; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 5px; }
    .tier-gold { background: linear-gradient(135deg, #fef08a, #eab308); color: #422006; border: 2px solid #ca8a04; }
    .tier-green { background: linear-gradient(135deg, #dcfce7, #22c55e); color: #052e16; border: 2px solid #15803d; }
    .tier-orange { background: linear-gradient(135deg, #ffedd5, #f97316); color: #431407; border: 2px solid #c2410c; } /* برتقالي مائل للحمرة */
    .tier-red { background: linear-gradient(135deg, #fee2e2, #ef4444); color: #fff; border: 2px solid #991b1b; }

    .container { flex: 1; overflow-y: auto; padding: 12px; max-width: 500px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    label { font-size: 0.8rem; font-weight: 700; color: #475569; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 0.88rem; background: #f8fafc; margin-bottom: 8px; }

    .btn { width: 100%; padding: 10px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 0.9rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-dark { background: var(--dark); color: #38bdf8; border: 1px solid #38bdf8; }
    .btn-outline { background: #fff; border: 2px solid var(--primary); color: var(--primary); }
    .btn-wa { background: #25D366; color: #fff; }

    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 8px 0 12px; }
    .cat-item { border: 2px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; background: #f8fafc; }
    .cat-item.selected { border-color: var(--primary); background: #eff6ff; }

    .driver-profile-box { background: #f8fafc; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 10px; }
    .driver-avatar { width: 58px; height: 58px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary); flex-shrink: 0; background: #e2e8f0; }
    .plate-box { background: #facc15; color: #000; font-weight: 900; padding: 2px 8px; border-radius: 5px; font-size: 0.82rem; display: inline-block; }

    .fullscreen-modal { position: fixed; inset: 0; width: 100vw; height: 100vh; background: #fff; z-index: 9999; display: none; flex-direction: column; }
    .fullscreen-modal.open { display: flex; }
    .modal-header { background: var(--dark); color: #fff; padding: 12px 15px; font-weight: 800; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
    #picker-map { flex: 1; width: 100%; }
    .map-modal-footer { position: absolute; bottom: 20px; left: 15px; right: 15px; z-index: 10000; display: flex; gap: 10px; }

    .explore-driver-pin { display: flex; flex-direction: column; align-items: center; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.45)); }
    .explore-driver-pin .car-icon { font-size: 28px; line-height: 1; margin-bottom: 2px; }
    .explore-driver-pin .rate-under { font-size: 0.68rem; font-weight: 900; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }

    .auth-overlay { position: fixed; inset: 0; background: var(--dark); z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 15px; }
    .auth-box { background: #fff; color: var(--dark); width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; }
  </style>
</head>
<body>

  <!-- شاشة الدخول -->
  <div class="auth-overlay" id="auth-screen">
    <div class="auth-box">
      <h3 style="text-align:center; color:var(--primary); margin-bottom:10px;">🚖 بوابة العميل</h3>
      <label>رقم الهاتف:</label>
      <input type="tel" id="login-phone" placeholder="01xxxxxxxxx">
      <label>كلمة المرور:</label>
      <input type="password" id="login-pass" placeholder="الباسورد">
      <button class="btn btn-primary" onclick="handleClientLogin()">🔓 دخول</button>
    </div>
  </div>

  <div class="topbar">
    <div id="hdr-client-badge" class="rating-frame tier-green">
      <span id="hdr-client-name">العميل</span>
      <span>⭐ <b id="hdr-client-rating">4.0</b></span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <div class="wallet-badge">💳 <span id="hdr-wallet">0</span> ج</div>
      <button onclick="logoutClient()" style="background:var(--danger); color:#fff; border:none; padding:4px 6px; border-radius:6px; font-size:0.7rem; cursor:pointer;">خروج</button>
    </div>
  </div>

  <div class="container">
    <div class="card" id="booking-card">
      <!-- زر استكشاف الكباتن حول العميل على الخريطة -->
      <button class="btn btn-dark" style="margin-bottom:12px; padding:11px;" onclick="openExploreMap()">
        📡 استكشف الكباتن المتاحين حولي عالخريطة (بتقييماتهم)
      </button>

      <h3 style="font-size:0.95rem; margin-bottom:10px;">📍 تحديد موقعك ووجهة المشوار</h3>
      <label>اختر فئة المركبة:</label>
      <div class="cat-grid" id="categories-grid"></div>

      <button class="btn btn-primary" style="margin-top:10px;" onclick="submitRideRequest()">🚀 اطلب المشوار الآن</button>
    </div>

    <div class="card" id="active-trip-card" style="display:none;">
      <div id="trip-status-title" style="font-weight:900; font-size:0.95rem; color:var(--primary); margin-bottom:8px;"></div>
      <div id="trip-driver-card" class="driver-profile-box" style="display:none;">
        <div style="font-size:0.82rem;" id="drv-details-text"></div>
      </div>
    </div>
  </div>

  <div class="fullscreen-modal" id="map-picker-modal">
    <div class="modal-header">
      <span id="picker-header-info">استكشاف الكباتن حولي</span>
      <button onclick="document.getElementById('map-picker-modal').classList.remove('open')" style="background:#dc2626; color:#fff; border:none; padding:4px 10px; border-radius:6px; cursor:pointer;">إغلاق ✖</button>
    </div>
    <div id="picker-map" style="flex:1;"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB5GqPcEhvzHoe45SYYUNL7E9oqVdmVrag",
      authDomain: "projectlinkst.firebaseapp.com",
      databaseURL: "https://projectlinkst-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "projectlinkst",
      storageBucket: "projectlinkst.firebasestorage.app",
      messagingSenderId: "704490160583",
      appId: "1:704490160583:web:c4031a44ee6ec2fffa99e2"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    mapboxgl.accessToken = "pk.eyJ1IjoibXVoYW1lZGVsaGFtYWxhd3kiLCJhIjoiY212dXZrcDJlMGF2YjM1czVqOGtkbWVldCJ9.yGoETr4LTcLOGbx1_UFc5Q";

    // تفعيل ملء الشاشة التلقائي
    window.addEventListener('click', () => {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }, { once: true });

    let currentClientPhone = localStorage.getItem('smartride_client_phone') || null;
    let settings = { categories: {} }, driversDB = {}, clientsDB = {}, ridesDB = {};
    let pickupCoords = { lat: 30.4660, lng: 31.1848 }, dropoffCoords = null, selectedCat = 'private_car';
    let myActiveRideId = null;

    function getRatingInfo(entity) {
      if (!entity || !entity.ratingCount || entity.ratingCount === 0) return { avg: 4.0, tierClass: 'tier-green', label: '4.0' };
      const avg = +(entity.ratingSum / entity.ratingCount).toFixed(2);
      let tierClass = 'tier-green';
      if (avg >= 4.7) tierClass = 'tier-gold';
      else if (avg >= 4.0) tierClass = 'tier-green';
      else if (avg >= 3.0) tierClass = 'tier-orange'; // برتقالي مائل للحمرة بدلاً من الأصفر
      else tierClass = 'tier-red';
      return { avg, tierClass, label: avg.toFixed(1) };
    }

    const pickerMap = new mapboxgl.Map({ container: 'picker-map', style: 'mapbox://styles/mapbox/streets-v12', center: [31.1848, 30.4660], zoom: 14 });
    let exploreMarkers = [];

    window.openExploreMap = function() {
      document.getElementById('map-picker-modal').classList.add('open');
      setTimeout(() => {
        pickerMap.resize();
        exploreMarkers.forEach(m => m.remove());
        exploreMarkers = [];
        Object.values(driversDB).forEach(d => {
          if (d.online && !d.isBlocked && d.lat && d.lng) {
            const rInfo = getRatingInfo(d);
            const el = document.createElement('div');
            el.className = 'explore-driver-pin';
            el.innerHTML = `<div class="car-icon">🚙</div><div class="rate-under ${rInfo.tierClass}">${d.name} | ⭐ ${rInfo.label}</div>`;
            exploreMarkers.push(new mapboxgl.Marker(el).setLngLat([d.lng, d.lat]).addTo(pickerMap));
          }
        });
      }, 100);
    };

    window.handleClientLogin = async function() {
      const phone = document.getElementById('login-phone').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const snap = await get(ref(db, `smartride/clients/${phone}`));
      if (!snap.exists()) return alert("رقم غير مسجل!");
      currentClientPhone = phone;
      localStorage.setItem('smartride_client_phone', phone);
      document.getElementById('auth-screen').style.display = 'none';
      refreshClientHeader();
    };

    window.logoutClient = function() {
      localStorage.removeItem('smartride_client_phone');
      currentClientPhone = null;
      document.getElementById('auth-screen').style.display = 'flex';
    };

    onValue(ref(db, 'smartride/settings'), snap => {
      if (snap.exists()) {
        settings = snap.val();
        renderCategories();
      }
    });
    onValue(ref(db, 'smartride/drivers'), snap => { driversDB = snap.val() || {}; });
    onValue(ref(db, 'smartride/clients'), snap => { clientsDB = snap.val() || {}; if (currentClientPhone) refreshClientHeader(); });
    onValue(ref(db, 'smartride/rides'), snap => { ridesDB = snap.val() || {}; handleActiveRideUI(); });

    function renderCategories() {
      const grid = document.getElementById('categories-grid');
      grid.innerHTML = '';
      Object.entries(settings.categories || {}).forEach(([k, c]) => {
        // فحص هل الإدارة معطلة هذا الاختيار (الخدمة)
        if (c.disabled) return;

        const div = document.createElement('div');
        div.className = `cat-item ${selectedCat === k ? 'selected' : ''}`;
        div.onclick = () => { selectedCat = k; renderCategories(); };
        div.innerHTML = `<div style="font-weight:800;">${c.name}</div>`;
        grid.appendChild(div);
      });
    }

    function refreshClientHeader() {
      if (!currentClientPhone || !clientsDB[currentClientPhone]) return;
      const c = clientsDB[currentClientPhone];
      const rInfo = getRatingInfo(c);
      document.getElementById('hdr-client-badge').className = `rating-frame ${rInfo.tierClass}`;
      document.getElementById('hdr-client-name').innerText = c.name;
      document.getElementById('hdr-client-rating').innerText = rInfo.label;
      document.getElementById('hdr-wallet').innerText = c.wallet ?? 0;
      document.getElementById('auth-screen').style.display = 'none';
    }

    window.submitRideRequest = async function() {
      if (!currentClientPhone) return alert("سجل دخول أولاً!");
      const rRef = push(ref(db, 'smartride/rides'));
      myActiveRideId = rRef.key;
      await set(rRef, {
        id: myActiveRideId, clientId: currentClientPhone, clientPhone: currentClientPhone,
        clientName: clientsDB[currentClientPhone]?.name || 'عميل', category: selectedCat,
        pickup: pickupCoords, dropoff: dropoffCoords || null, status: 'offering', createdAt: Date.now()
      });
    };

    function handleActiveRideUI() {
      if (!currentClientPhone) return;
      const r = Object.values(ridesDB).find(r => r.clientId === currentClientPhone && !['completed','cancelled_no_show','cancelled_by_driver','cancelled_by_client'].includes(r.status));
      if (!r) { document.getElementById('active-trip-card').style.display = 'none'; document.getElementById('booking-card').style.display = 'block'; return; }

      document.getElementById('booking-card').style.display = 'none';
      document.getElementById('active-trip-card').style.display = 'block';
      const drv = driversDB[r.driverId] || {};

      if (r.status === 'accepted' || r.status === 'arrived') {
        document.getElementById('trip-status-title').innerText = r.status === 'accepted' ? "🚙 الكابتن في الطريق إليك" : "📍 الكابتن وصل!";
        document.getElementById('trip-driver-card').style.display = 'block';
        document.getElementById('drv-details-text').innerHTML = `
          <b>الكابتن:</b> ${drv.name || r.driverName}<br>
          <b>الحالة للكابتن:</b> ${r.status === 'accepted' ? 'في الطريق إليك' : 'بدأ الرحلة'}
        `;
      } else if (r.status === 'in_progress') {
        document.getElementById('trip-status-title').innerText = "🚀 الرحلة جارية الآن نحو وجهتك";
      }
    }
  </script>
</body>
</html>
